# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Bulid JAR -> Docker Image -> Push -> Delpoy

on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-HelloWorld/demo-app
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
          context: Project-HelloWorld/demo-app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
    - name: Login EC2 and Deploy image
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
               export PATH=$PATH:/usr/bin:/usr/local/bin
               docker stop demo-app || true 
               docker rm demo-app || true 
               docker pull ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
               docker run -d --name demo-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
               
